<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird風ゲーム（カモンちゃん対応）</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 0;
        }
        #target {
            background-color: #70c5ce; /* 空の色 */
            border: 2px solid #333;
        }
    </style>
</head>
<body>

    <h1>Flappy Bird 風ゲーム</h1>
    <p>【操作方法】スペースキー：ジャンプ / 再スタート</p>

    <div>    
        <canvas id="target" width="640" height="480"></canvas>
    </div>

<script>
// デバッグモードの設定
const DEBUG_MODE = false;

// キー入力の管理オブジェクト
const keyPressed = new Set();
const keyPushed = new Set();

function onKeyDown(event) {
    if (!event.repeat) {
        keyPressed.add(event.code);
        keyPushed.add(event.code);
    }
    if (event.code === "Space") {
        event.preventDefault();
    }
}

function onKeyUp(event) {
    keyPressed.delete(event.code);
}

document.addEventListener("keydown", onKeyDown);
document.addEventListener("keyup", onKeyUp);

// CanvasとContextの取得
const canvas = document.getElementById("target");
const context = canvas.getContext("2d");

const w = canvas.width;
const h = canvas.height;

// --- キャラクター画像の読み込み ---
// 画像ファイル名が同じフォルダにあることを前提に読み込みます
const charImg = document.createElement("img");
charImg.src = "nise-kamonchan.png";      // 通常時の画像（ファイルがある場合）

const charJumpImg = document.createElement("img");
charJumpImg.src = "nise-kamonchan-jump.png"; // ジャンプ（上昇）時の画像

// ゲームの各種変数
let x = 100;         
let y = h / 2;       
let vy = 0;          
const g = 0.45;      
const jumpSpeed = 8; 
const radius = 25;   // キャラクターの大きさに合わせて調整（半径25 = 直径50px）

let obstacles = [];  
let spawnTimer = 0;  
const spawnInterval = 90; 
const pipeWidth = 70;     
const gapHeight = 130;    
const pipeSpeed = 3.5;    

let score = 0;
let gameOver = false;

function resetGame() {
    x = 100;
    y = h / 2;
    vy = 0;
    obstacles = [];
    spawnTimer = 0;
    score = 0;
    gameOver = false;
}

function update() {
    // 1. 状態の更新
    if (!gameOver) {
        if (keyPushed.has("Space")) {
            vy = -jumpSpeed;
        }

        vy += g;
        y += vy;

        // 障害物の移動 & 削除
        const nextObstacles = [];
        for (const obs of obstacles) {
            obs.x -= pipeSpeed;

            if (!obs.passed && obs.x + pipeWidth / 2 < x) {
                score++;
                obs.passed = true;
            }

            if (obs.x + pipeWidth / 2 > 0) {
                nextObstacles.push(obs);
            }
        }
        obstacles = nextObstacles;

        // 障害物の生成
        spawnTimer--;
        if (spawnTimer <= 0) {
            const margin = 80;
            const gapY = margin + Math.random() * (h - margin * 2);

            obstacles.push({
                x: w + pipeWidth / 2,
                y: gapY,
                passed: false
            });
            spawnTimer = spawnInterval;
        }

        // 当たり判定
        if (y - radius < 0 || y + radius > h) {
            gameOver = true;
        }

        for (const obs of obstacles) {
            const pipeLeft = obs.x - pipeWidth / 2;
            const pipeRight = obs.x + pipeWidth / 2;
            const topPipeBottom = obs.y - gapHeight / 2;
            const bottomPipeTop = obs.y + gapHeight / 2;

            if (x + radius > pipeLeft && x - radius < pipeRight) {
                if (y - radius < topPipeBottom || y + radius > bottomPipeTop) {
                    gameOver = true;
                }
            }
        }
    } else {
        if (keyPushed.has("Space")) {
            resetGame();
        }
    }

    // 2. 画面の描画
    context.clearRect(0, 0, w, h);

    // 障害物（土管）の描画
    context.save();
    context.fillStyle = "#73bf2e";   
    context.strokeStyle = "#53801b"; 
    context.lineWidth = 3;

    for (const obs of obstacles) {
        const pipeLeft = obs.x - pipeWidth / 2;
        const topPipeHeight = obs.y - gapHeight / 2;
        const bottomPipeY = obs.y + gapHeight / 2;
        const bottomPipeHeight = h - bottomPipeY;

        context.fillRect(pipeLeft, 0, pipeWidth, topPipeHeight);
        context.strokeRect(pipeLeft, 0, pipeWidth, topPipeHeight);

        context.fillRect(pipeLeft, bottomPipeY, pipeWidth, bottomPipeHeight);
        context.strokeRect(pipeLeft, bottomPipeY, pipeWidth, bottomPipeHeight);
    }
    context.restore();

    // ----------------------------------------------------
    // 3. キャラクターの描画（左右反転 ＆ 傾き ＆ 画像切り替え）
    // ----------------------------------------------------
    context.save();
    context.translate(x, y); // キャラクタの中心座標へ移動

    // 左右反転（資料デモ10・11・12の解説通りの記述）[cite: 20, 22]
    context.scale(-1, 1);

    // 速度vyに合わせた傾き（ラジアン変換）
    let angle = Math.min(Math.max(vy * 3, -25), 50) * Math.PI / 180;
    context.rotate(angle);

    // 上昇中（vy < 0）のときはジャンプ用の画像、それ以外は通常画像を使用
    let currentImg = (vy < 0 && charJumpImg.complete && charJumpImg.naturalWidth !== 0) 
                     ? charJumpImg 
                     : charImg;

    if (currentImg.complete && currentImg.naturalWidth !== 0) {
        // 画像を描画（中心が (0,0) になるように -radius を指定）[cite: 22]
        context.drawImage(currentImg, -radius, -radius, radius * 2, radius * 2);
    } else {
        // 画像がまだ読み込まれていない、またはエラー時の代替描画（円）
        context.beginPath();
        context.arc(0, 0, radius, 0, 2 * Math.PI);
        context.fillStyle = "#ffcc00";
        context.fill();
        context.stroke();
    }
    context.restore();

    // スコアの表示
    context.save();
    context.font = "bold 28px sans-serif";
    context.fillStyle = "white";
    context.strokeStyle = "black";
    context.lineWidth = 4;
    context.textAlign = "center";
    
    context.strokeText(`スコア: ${score}`, w / 2, 50);
    context.fillText(`スコア: ${score}`, w / 2, 50);

    // ゲームオーバー画面
    if (gameOver) {
        context.fillStyle = "rgba(0, 0, 0, 0.5)";
        context.fillRect(0, 0, w, h);

        context.font = "bold 40px sans-serif";
        context.fillStyle = "#ff4444";
        context.textAlign = "center";
        context.strokeText("GAME OVER", w / 2, h / 2 - 20);
        context.fillText("GAME OVER", w / 2, h / 2 - 20);

        context.font = "20px sans-serif";
        context.fillStyle = "white";
        context.strokeText("PRESS SPACE TO RESTART", w / 2, h / 2 + 30);
        context.fillText("PRESS SPACE TO RESTART", w / 2, h / 2 + 30);
    }

    context.restore();
    keyPushed.clear();
}

// 約1/60秒ごとに実行
setInterval(update, 17);
</script>

</body>
</html>
